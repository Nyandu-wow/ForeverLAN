<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forever LAN — Diagnostics</title>
  <link rel="stylesheet" href="/public/lan-chrome.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink, #f3ebe0);
      background: #0c0a10;
      font-family: var(--story), Georgia, serif;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 {
      font-family: Cinzel, serif;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--gold, #c9a24a);
      margin: 0 0 0.35rem;
    }
    .sub { color: var(--ink-dim, #a89b88); font-size: 0.9rem; margin-bottom: 1.25rem; }
    nav a {
      color: var(--gold, #c9a24a);
      text-decoration: none;
      margin-right: 0.85rem;
      font-family: Cinzel, serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }
    nav a.on { text-decoration: underline; }
    .panel {
      border: 1px solid rgba(201,162,74,0.35);
      background: rgba(20,16,28,0.85);
      padding: 0.85rem 1rem;
      margin-bottom: 0.85rem;
    }
    .panel h2 {
      margin: 0 0 0.55rem;
      font-family: Cinzel, serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--gold, #c9a24a);
    }
    .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.2rem 0; font-size: 0.88rem; }
    .row b { font-weight: 600; }
    .notes li { margin: 0.25rem 0; color: var(--ink-dim, #a89b88); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.35rem 0.25rem; border-bottom: 1px solid rgba(201,162,74,0.15); }
    th { font-family: Cinzel, serif; font-size: 0.55rem; letter-spacing: 0.1em; color: var(--gold, #c9a24a); }
    .st-REPORTING { color: #6fcf97; }
    .st-STALE { color: #c9a24a; }
    .st-CATCHING_UP { color: #7ad1ff; }
    .st-OFFLINE { color: #a89b88; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/">LIVE</a>
      <a href="/characters">CHARACTERS</a>
      <a href="/wrap">WRAP</a>
      <a class="on" href="/diagnostics">DIAG</a>
    </nav>
    <h1>HOST DIAGNOSTICS</h1>
    <p class="sub">Are we collecting everybody — or is someone silently missing? Host-only view. No tokens or paths.</p>
    <div id="app"><div class="panel">Loading…</div></div>
  </div>
  <script>
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    async function load() {
      const app = document.getElementById("app");
      try {
        const d = await (await fetch("/api/v1/diagnostics")).json();
        const h = d.host || {};
        const r = d.roster || {};
        app.innerHTML = `
          <div class="panel">
            <h2>HOST</h2>
            <div class="row"><span>Ready</span><b>${h.ready ? "yes" : "booting"}</b></div>
            <div class="row"><span>Catch-up rebuild</span><b>${h.catch_up_active ? "active" : "idle"}</b></div>
            <div class="row"><span>Fold errors</span><b style="color:${(h.fold_errors || 0) > 0 ? "#e07a5f" : "#6fcf97"}">${esc(h.fold_errors ?? 0)}</b></div>
            <div class="row"><span>Events in log</span><b>${esc(h.event_count ?? "—")}</b></div>
            <div class="row"><span>Last host ingest</span><b>${esc(h.last_ingest_label || "—")}</b></div>
            <div class="row"><span>Last game event</span><b>${esc(h.last_event_at ? new Date(h.last_event_at).toLocaleString() : "—")}</b></div>
            <div class="row"><span>SSE dashboards</span><b>${esc(h.sse_clients ?? "—")}</b></div>
            <div class="row"><span>Ingest clients seen</span><b>${esc(h.ingest_clients_seen ?? "—")}</b></div>
          </div>
          <div class="panel">
            <h2>ROSTER TELEMETRY</h2>
            <div class="row"><span>Reporting / catching up</span><b>${esc(r.reporting ?? 0)}</b></div>
            <div class="row"><span>Stale</span><b>${esc(r.stale ?? 0)}</b></div>
            <div class="row"><span>Offline</span><b>${esc(r.offline ?? 0)}</b></div>
            <table>
              <tr><th>Character</th><th>Status</th><th>Host ingest</th><th>Game event</th></tr>
              ${(r.players || [])
                .map(
                  (p) => `<tr>
                  <td>${esc(p.character)}</td>
                  <td class="st-${esc(p.status)}">${esc(p.status)}</td>
                  <td>${esc(p.host_ingest_label || "—")}</td>
                  <td>${esc(p.game_event_label || "—")}</td>
                </tr>`
                )
                .join("")}
            </table>
          </div>
          <div class="panel">
            <h2>NOTES</h2>
            <ul class="notes">${(d.notes || []).map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
          </div>`;
      } catch (err) {
        app.innerHTML = `<div class="panel">Failed to load diagnostics: ${esc(err.message)}</div>`;
      }
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
