# Cloudflare Tunnel config for ForeverLAN
# 1. Run: cloudflared tunnel create foreverlan
# 2. Fill tunnel UUID + credentials-file path below
# 3. cloudflared tunnel route dns foreverlan foreverlan.example.com
# 4. cloudflared tunnel --config this-file run

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\REPLACE\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: foreverlan.example.com
    service: http://127.0.0.1:8765
  - service: http_status:404
