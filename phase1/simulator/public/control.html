<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forever LAN — Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --warn: #d29922;
        --line: #30363d;
        --ok: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      h1 { margin: 0; font-size: 1.15rem; }
      .banner {
        margin-top: 0.6rem;
        padding: 0.55rem 0.75rem;
        background: #21262d;
        border: 1px solid var(--warn);
        color: #e3b341;
        font-size: 0.85rem;
      }
      main {
        max-width: 720px;
        padding: 1rem 1.25rem 2rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 1rem;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
      button {
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--line);
        padding: 0.45rem 0.7rem;
        cursor: pointer;
        border-radius: 4px;
      }
      button.primary { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .meta {
        font-family: Consolas, monospace;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.55;
      }
      .meta strong { color: var(--ok); }
      a { color: var(--accent); }
      .cast {
        margin-top: 1rem;
        display: grid;
        gap: 0.35rem;
        font-family: Consolas, monospace;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Forever LAN — Continuous Simulator</h1>
      <div class="banner">
        SIMULATED / NOT YET VERIFIED — one continuous LAN weekend world.
        Watch the board at
        <a id="viz" href="http://127.0.0.1:8765/" target="_blank">Forever LAN board</a>.
      </div>
    </header>
    <main>
      <section class="panel">
        <h2>LAN WEEKEND</h2>
        <p class="meta" style="margin-top:0;margin-bottom:1rem">
          Continuous sim: levels, zones, PvP kills, deaths, dungeons.
          No scenario picker — hit Start and leave it running.
        </p>
        <div class="row">
          <button class="primary" id="btnStart">Start</button>
          <button id="btnPause">Pause</button>
          <button id="btnResume">Resume</button>
          <button id="btnReset">Reset</button>
          <button id="btnFaster">Faster</button>
          <button id="btnSlower">Slower</button>
        </div>
        <div class="meta" id="state">Loading…</div>
        <div class="cast" id="cast"></div>
      </section>
    </main>
    <script>
      const stateEl = document.getElementById("state");
      const castEl = document.getElementById("cast");

      function renderState(st) {
        if (st.hostUrl) {
          document.getElementById("viz").href = st.hostUrl.replace(/\/$/, "") + "/";
        }
        stateEl.innerHTML = `
          status: <strong>${st.status}</strong><br/>
          world: ${st.scenarioId || "lan_weekend"} (continuous)<br/>
          runId: ${st.runId}<br/>
          tick: ${st.tick ?? 0}<br/>
          events sent: ${st.sent}<br/>
          interval: ${st.intervalMs}ms<br/>
          host: ${st.hostUrl}<br/>
          ${st.lastError ? "error: " + st.lastError : ""}
        `;
        if (Array.isArray(st.players) && st.players.length) {
          castEl.innerHTML = st.players
            .map(
              (p) =>
                `${p.character} · L${p.level} ${p.class} · ${p.zone || "?"} · kills ${
                  p.pvp_kills || 0
                } · deaths ${p.deaths || 0}`
            )
            .join("<br/>");
        } else {
          castEl.textContent = "";
        }
      }

      async function refresh() {
        const st = await fetch("/api/state").then((r) => r.json());
        renderState(st);
      }

      async function post(path, body = {}) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) alert(data.error);
        renderState(data.state || data);
      }

      document.getElementById("btnStart").onclick = () =>
        post("/api/start", { scenarioId: "lan_weekend" });
      document.getElementById("btnPause").onclick = () => post("/api/pause");
      document.getElementById("btnResume").onclick = () => post("/api/resume");
      document.getElementById("btnReset").onclick = () => post("/api/reset");
      document.getElementById("btnFaster").onclick = () => post("/api/speed", { intervalMs: 900 });
      document.getElementById("btnSlower").onclick = () => post("/api/speed", { intervalMs: 2500 });

      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
