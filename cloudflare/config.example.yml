# Cloudflare Tunnel — Forever LAN remote beta (push-only)
#
# WAN exposes friend ingest only. Watch the board on the host PC locally.
# Replace *.example.com with your own DNS names before generating config.yml.
#
# Optional remote board hostname + Cloudflare Access are separate (see access-policy.md).

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\Users\REPLACE\.cloudflared\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: foreverlan-ingest.example.com
    service: http://127.0.0.1:8765
  - service: http_status:404
